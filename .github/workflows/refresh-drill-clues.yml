name: Grow drill clue pool

on:
  schedule:
    # Every Monday 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grow each type's pool by ~100
        run: python3 drill/build/fetch_clues.py

      - name: Commit if data.js changed
        run: |
          if git diff --quiet -- drill/data.js; then
            echo "No new clues this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drill/data.js
          git commit -m "Grow drill clue pool (automated weekly refresh)"
          git push
